services:
  app-blue:
    image: ghcr.io/afintech510/larkin-tech/larkintech-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    container_name: larkintech-blue
    ports:
      - "3200:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app-green:
    image: ghcr.io/afintech510/larkin-tech/larkintech-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    container_name: larkintech-green
    ports:
      - "3201:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    profiles:
      - green
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  drip-cron:
    image: ghcr.io/afintech510/larkin-tech/larkintech-app:latest
    container_name: larkintech-drip-cron
    env_file:
      - .env.local
    entrypoint: ["sh", "-c", "while true; do node -e \"require('./scripts/process-drip.ts')\" 2>&1; sleep 900; done"]
    restart: unless-stopped
    depends_on:
      - app-blue
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx-proxy:
    image: nginx:alpine
    container_name: larkintech-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app-blue
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
