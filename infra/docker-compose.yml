services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nextjs
      - fastapi
    networks:
      - benchworks-net
    restart: unless-stopped

  nextjs:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file: .env
    depends_on:
      - fastapi
    networks:
      - benchworks-net
    restart: unless-stopped

  fastapi:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - redis
    networks:
      - benchworks-net
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    expose:
      - "5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - DB_TYPE=${N8N_DB_TYPE}
      - DB_POSTGRESDB_HOST=${N8N_DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${N8N_DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=${N8N_DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${N8N_DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_POSTGRESDB_PASSWORD}
      - SMARTLEAD_API_KEY=${SMARTLEAD_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - benchworks-net
    restart: unless-stopped

  calcom:
    image: calcom/cal.com:latest
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${CALCOM_DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/calcom}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CALENDSO_ENCRYPTION_KEY=${CALCOM_ENCRYPTION_KEY:-change-me-32-char-encryption-key}
    volumes:
      - calcom_data:/app/data
    networks:
      - benchworks-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - benchworks-net
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  n8n_data:
  calcom_data:

networks:
  benchworks-net:
    driver: bridge
