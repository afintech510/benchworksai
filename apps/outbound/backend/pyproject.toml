[project]
name = "benchworks-api"
version = "0.1.0"
description = "BenchworksAI Outbound Engine API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "redis>=5.2.0",
    "supabase>=2.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
