name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-benchworks-outbound
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 25m
          script: |
            set -e
            cd /opt/benchworks-outbound
            git fetch --all --prune
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            curl -fsS --max-time 10 --retry 6 --retry-delay 4 --retry-connrefused http://localhost:3005/v1/health >/dev/null \
              && echo "health OK (:3005 /v1/health)" \
              || echo "WARN: health check did not pass (deploy applied)"
