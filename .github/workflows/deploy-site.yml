name: Deploy site (benchworksai.com)

# Path-filtered deploy for apps/site (the public marketing site).
#
# NOTE: auto-deploy on push is intentionally DISABLED until the VPS box that
# serves the site is re-pointed from the old `larkin-tech` repo to this
# monorepo (see .github/DEPLOY-MIGRATION.md). Until then this runs manually
# via the Actions tab. Once the box is migrated, uncomment the `push:` block.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/site/**'
  #     - '.github/workflows/deploy-site.yml'

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/site
          file: apps/site/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_SITE_PATH || '/opt/benchworksai' }}
            git fetch --all --prune
            git reset --hard origin/main
            cd apps/site
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sleep 5
            response=$(curl -sf http://localhost:3200/api/health || curl -sf http://localhost:3201/api/health)
            echo "Health check response: $response"
            echo "$response" | grep -q '"healthy"' || (echo "Health check FAILED" && exit 1)

      - name: Deployment failed
        if: failure()
        run: |
          echo "::error::Site deployment failed! Check VPS logs."
          echo "## Site deployment failed" >> $GITHUB_STEP_SUMMARY
